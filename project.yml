name: Parlor
options:
  bundleIdPrefix: com.zyniker.parlor
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  CardModel:
    path: Packages/CardModel
  CardExpr:
    path: Packages/CardExpr
  RulesEngine:
    path: Packages/RulesEngine
  RulesetKit:
    path: Packages/RulesetKit
  GameLibrary:
    path: Packages/GameLibrary
  CardAI:
    path: Packages/CardAI
  Teaching:
    path: Packages/Teaching
  TableNet:
    path: Packages/TableNet
  TableUI:
    path: Packages/TableUI
  Library:
    path: Packages/Library
  Accessibility:
    path: Packages/Accessibility
  Persistence:
    path: Packages/Persistence
  Platform:
    path: Packages/Platform
targets:
  Parlor-iOS:
    type: application
    platform: iOS
    sources:
      - App/Shared
      - App/iOS
    dependencies:
      - package: CardModel
      - package: CardExpr
      - package: RulesEngine
      - package: RulesetKit
      - package: GameLibrary
      - package: CardAI
      - package: Teaching
      - package: TableNet
      - package: TableUI
      - package: Library
      - package: Accessibility
      - package: Persistence
      - package: Platform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyniker.parlor
        PRODUCT_MODULE_NAME: ParloriOS
        INFOPLIST_FILE: App/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
  Parlor-macOS:
    type: application
    platform: macOS
    sources:
      - App/Shared
      - App/macOS
    dependencies:
      - package: CardModel
      - package: CardExpr
      - package: RulesEngine
      - package: RulesetKit
      - package: GameLibrary
      - package: CardAI
      - package: Teaching
      - package: TableNet
      - package: TableUI
      - package: Library
      - package: Accessibility
      - package: Persistence
      - package: Platform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyniker.parlor.macos
        PRODUCT_MODULE_NAME: ParlorMacOS
        INFOPLIST_FILE: App/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  Parlor-iOS-Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/iOS
    dependencies:
      - target: Parlor-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyniker.parlor.ios.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Parlor-iOS.app/Parlor-iOS
        BUNDLE_LOADER: $(TEST_HOST)
  Parlor-macOS-Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/macOS
    dependencies:
      - target: Parlor-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyniker.parlor.macos.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Parlor-macOS.app/Contents/MacOS/Parlor-macOS
        BUNDLE_LOADER: $(TEST_HOST)
  Parlor-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Parlor-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyniker.parlor.ios.uitests
  Parlor-macOS-UITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: Parlor-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zyniker.parlor.macos.uitests
