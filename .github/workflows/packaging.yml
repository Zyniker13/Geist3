# SPDX-License-Identifier: MIT OR Apache-2.0
name: Packaging
on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - '.github/workflows/packaging.yml'
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/packaging.yml'
permissions:
  contents: read
jobs:
  deb:
    name: .deb (Debian/Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Build .deb
        run: |
          ./packaging/build-deb.sh 0.1.0 amd64
          ls -la *.deb
      - name: Install .deb
        run: |
          sudo dpkg -i ztop_0.1.0_amd64.deb
          which ztop
          ztop --version
      - name: Test agent
        run: |
          # Start the agent in the background
          ztop agent --tls --pair --port 7102 &
          AGENT_PID=$!
          sleep 5
          # Check that the agent is running
          if ! kill -0 $AGENT_PID 2>/dev/null; then
            echo "Agent failed to start"
            exit 1
          fi
          # Kill the agent
          kill $AGENT_PID
          wait $AGENT_PID 2>/dev/null || true
      - name: Uninstall .deb
        run: |
          sudo dpkg -r ztop
          which ztop || echo "ztop removed successfully"

  homebrew:
    name: Homebrew (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Build ztop
        run: |
          cargo build --release
          ls -la target/release/ztop
      - name: Test agent
        run: |
          # Start the agent in the background
          ./target/release/ztop agent --tls --pair --port 7102 &
          AGENT_PID=$!
          sleep 5
          # Check that the agent is running
          if ! kill -0 $AGENT_PID 2>/dev/null; then
            echo "Agent failed to start"
            exit 1
          fi
          # Kill the agent
          kill $AGENT_PID
          wait $AGENT_PID 2>/dev/null || true
