name: record
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/record.yml'
      - 'crates/core/src/capture.rs'
      - 'crates/core/src/fixture.rs'
permissions:
  contents: read
jobs:
  record-linux-x86_64:
    name: Record fixture (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Build and record a fixture
        run: |
          cargo build -p ztop
          ./target/debug/ztop capture --out "$RUNNER_TEMP/fixture"
          tar -czf - -C "$RUNNER_TEMP/fixture" . | base64 -w 76 > "$RUNNER_TEMP/fixture.b64"
          echo "entries: $(ls "$RUNNER_TEMP/fixture/data" | wc -l)"
          echo "b64 bytes: $(wc -c < "$RUNNER_TEMP/fixture.b64")"
          sha256sum "$RUNNER_TEMP/fixture.b64"
      - name: Publish the fixture to the job summary
        run: |
          {
            echo "## ztop fixture (x86_64)"
            echo
            echo "base64 of tar.gz; decode with: base64 -d | tar -xzf -"
            echo
            echo '```'
            cat "$RUNNER_TEMP/fixture.b64"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  record-linux-aarch64:
    name: Record fixture (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Build and record a fixture
        run: |
          cargo build -p ztop
          ./target/debug/ztop capture --out "$RUNNER_TEMP/fixture"
          tar -czf - -C "$RUNNER_TEMP/fixture" . | base64 -w 76 > "$RUNNER_TEMP/fixture.b64"
          echo "entries: $(ls "$RUNNER_TEMP/fixture/data" | wc -l)"
          echo "b64 bytes: $(wc -c < "$RUNNER_TEMP/fixture.b64")"
          sha256sum "$RUNNER_TEMP/fixture.b64"
      - name: Publish the fixture to the job summary
        run: |
          {
            echo "## ztop fixture (aarch64)"
            echo
            echo "base64 of tar.gz; decode with: base64 -d | tar -xzf -"
            echo
            echo '```'
            cat "$RUNNER_TEMP/fixture.b64"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
