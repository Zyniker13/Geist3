# Parlor CI (CONVENTIONS §7). Runs on every push and pull request.
# Steps that have nothing to run yet succeed as no-ops with a printed
# notice (rules-cli / net-fuzz stubs until P3 / P8).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ci:
    name: build-test-lint
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fixed toolchain (Homebrew)
        run: brew install xcodegen swiftlint swift-format

      - name: Toolchain report
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
          swiftlint version
          swift-format version
          xcrun simctl list devices available

      - name: Preflight required simulators
        run: |
          xcrun simctl list devices available | grep -E "iPhone 17|iPad Pro 13-inch \(M5\)"

      - name: make bootstrap
        run: make bootstrap

      - name: make lint (zero warnings) and check-imports
        run: make lint

      - name: Package tests with coverage
        run: make coverage

      - name: Publish failure detail (best effort, public branch)
        if: failure()
        run: |
          {
            echo "run: ${{ github.run_id }}"
            echo "sha: ${{ github.sha }}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "--- toolchain ---"
            swift --version
            xcodebuild -version
            echo
            echo "--- disk ---"
            df -h /
            echo
            echo "--- memory ---"
            sysctl hw.memsize
            vm_stat
            echo
            echo "--- crash reports (.ips modified in last 15 min; full text of newest 2) ---"
            RECENT=$(find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports -name '*.ips' -mmin -15 2>/dev/null | sort)
            if [ -z "$RECENT" ]; then
              echo "(no .ips files modified in the last 15 minutes — likely SIGKILL, e.g. OOM)"
            else
              echo "$RECENT"
              N=0
              for f in $RECENT; do
                N=$((N+1))
                if [ "$N" -le 2 ]; then
                  echo "=== FULL: $f ==="
                  sed -e 's/GITHUB_TOKEN=[^ "]*//g' "$f"
                fi
              done
            fi
            echo
            echo "--- coverage logs (full) ---"
            for f in reports/coverage/*.log; do
              [ -f "$f" ] || continue
              echo "=== $f ($(wc -l < "$f") lines) ==="
              cat "$f"
            done
          } > ci-failure-detail.txt
          git config user.name "parlor-ci"
          git config user.email "parlor-ci@users.noreply.github.com"
          BR="ci-failure-run-${{ github.run_id }}"
          git checkout -b "$BR"
          git add ci-failure-detail.txt
          git commit -m "ci: failure detail for run ${{ github.run_id }}"
          git push origin "$BR" || echo "PUSH-FAILED: GITHUB_TOKEN lacks contents:write"

      - name: Coverage threshold (CardModel and RulesEngine >= 90%)
        run: make coverage-check

      - name: make conformance
        run: make conformance

      - name: make validate
        run: make validate

      - name: Schema freshness + reference rulesets against the JSON Schemas (P2.9)
        run: |
          make schema-check
          python3 -m venv "$PWD/.venv-schema"
          "$PWD/.venv-schema/bin/pip" install --quiet jsonschema
          "$PWD/.venv-schema/bin/python" scripts/validate-schemas.py

      - name: make sim N=200
        run: make sim N=200

      - name: make fuzz-quick
        run: make fuzz-quick

      - name: "make gen and make build (iPhone 17, iPad Pro 13-inch, macOS; warnings as errors)"
        env:
          SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
          GCC_TREAT_WARNINGS_AS_ERRORS: "YES"
        run: |
          make gen
          make build

      - name: "xcodebuild test (UI and snapshot: iPhone 17, iPad Pro 13-inch, macOS)"
        run: make test-apps

      - name: Golden replays and engine suite on the iOS simulator (cross-platform hashes)
        run: make test-replays-ios

      - name: make snapshot
        run: make snapshot

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parlor-ci-reports
          path: |
            reports/
          if-no-files-found: ignore
