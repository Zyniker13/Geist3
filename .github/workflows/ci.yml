# SPDX-License-Identifier: MIT OR Apache-2.0
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    # A wedged job must die as a visible failure, not eat the default
    # six-hour limit: CI once hung silently on a ptrace test.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny,cross
      - run: scripts/check.sh
      # aarch64 Linux is checked nowhere else: every crate reaches
      # ring's C code, so the target clippy needs a real cross C
      # toolchain (decision 0043), which cross ships in its container.
      - run: cross clippy --workspace --all-targets --target aarch64-unknown-linux-gnu -- -D warnings
  fuzz:
    name: Fuzz smoke
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # nightly
        with:
          toolchain: nightly
      # Install cargo-fuzz with the nightly toolchain, not the
      # runner's preinstalled rust: that one is x86_64 (Rosetta), and
      # a cargo-fuzz built with it targets x86_64-apple-darwin, which
      # the arm64 nightly toolchain has no std for, so every target
      # fails with E0463. An arm64 cargo-fuzz targets the native
      # aarch64-apple-darwin (decision 0059).
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: fuzz
      # Every network-facing parser runs a short fuzz smoke on every
      # push (decision 0057); macOS is the host where all seventeen
      # targets compile, including the macOS-only sysctl one.
      - run: scripts/fuzz-smoke.sh
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - run: brew install xcodegen
      - run: scripts/check.sh
