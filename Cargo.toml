# SPDX-License-Identifier: MIT OR Apache-2.0
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/tui",
    "crates/agent",
    "crates/hub",
    "crates/ztop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
