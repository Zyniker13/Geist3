[package]
name = "ztop-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ztop-core]
path = "../crates/core"

# One fuzzing target per network-facing parser; scripts/fuzz-smoke.sh
# runs every one of them for a short smoke run on each push.
[[bin]]
name = "parse_chip_topology"
path = "fuzz_targets/parse_chip_topology.rs"
test = false
doc = false
bench = false

